artifacts_root: artifacts

#source url needs to be changed
data_ingestion:
  root_dir: artifacts/data_ingestion
  source_URL: https://huggingface.co/datasets/usr-Ayan/inabs-dataset/resolve/main/inabs_dataset.zip
  local_data_file: artifacts/data_ingestion/data.zip
  unzip_dir: artifacts/data_ingestion


data_validation:
  root_dir: artifacts/data_validation
  data_path: artifacts/data_ingestion/inabs_dataset
  STATUS_FILE: artifacts/data_validation/status.txt
  ALL_REQUIRED_FILES: ["train", "test", "validation"]



# data path needs to be changed
data_transformation:
  root_dir: artifacts/data_transformation
  data_path: artifacts/data_ingestion/inabs_dataset
  tokenizer_name: google/pegasus-cnn_dailymail

# data path needs to be changed
model_trainer:
  root_dir: artifacts/model_trainer
  data_path: artifacts/data_transformation/inabs_dataset
  model_ckpt: google/pegasus-cnn_dailymail

# data path needs to be changed
model_evaluation:
  root_dir: artifacts/model_evaluation
  data_path: artifacts/data_transformation/inabs_dataset
  model_path: artifacts/model_trainer/legal-pegasus-inabs-model
  tokenizer_path: artifacts/model_trainer/legal-pegasus-inabs-tokenizer
  metric_file_name: artifacts/model_evaluation/metrics.csv



